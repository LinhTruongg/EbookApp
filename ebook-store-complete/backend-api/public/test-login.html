<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Login API</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 500px;
            margin: 50px auto;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: white;
        }
        .container {
            background: rgba(255, 255, 255, 0.1);
            padding: 30px;
            border-radius: 10px;
            backdrop-filter: blur(10px);
        }
        h1 {
            text-align: center;
            margin-bottom: 30px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 5px;
            box-sizing: border-box;
            font-size: 16px;
        }
        button {
            width: 100%;
            padding: 12px;
            background: #007AFF;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            background: #0056CC;
        }
        .result {
            margin-top: 20px;
            padding: 15px;
            border-radius: 5px;
            word-break: break-all;
        }
        .success {
            background: rgba(40, 167, 69, 0.2);
            border: 1px solid #28a745;
        }
        .error {
            background: rgba(220, 53, 69, 0.2);
            border: 1px solid #dc3545;
        }
        .info {
            background: rgba(23, 162, 184, 0.2);
            border: 1px solid #17a2b8;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔐 Test Login API</h1>
        
        <div class="info">
            <strong>Pre-filled Test Account:</strong><br>
            Email: nguyenvanan@gmail.com<br>
            Password: 123456
        </div>

        <form id="loginForm">
            <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" id="email" value="nguyenvanan@gmail.com" required>
            </div>
            
            <div class="form-group">
                <label for="password">Password:</label>
                <input type="password" id="password" value="123456" required>
            </div>
            
            <button type="submit">🚀 Test Login</button>
        </form>

        <div id="result"></div>
    </div>

    <script>
        console.log('🟢 Test login script loaded successfully!');
        
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            console.log('🔵 Form submitted!');
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const resultDiv = document.getElementById('result');
            
            console.log('🔵 Login attempt:', { email, password });
            
            resultDiv.innerHTML = '<div class="info">⏳ Testing login...</div>';
            
            try {
                console.log('🔵 Making fetch request...');
                const response = await fetch('/api/auth/login', {  // Use relative URL
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ email, password })
                });
                
                console.log('🔵 Response received:', response.status, response.statusText);
                
                const data = await response.json();
                
                if (response.ok && data.success) {
                    resultDiv.innerHTML = `
                        <div class="success">
                            <strong>✅ Login Successful!</strong><br><br>
                            <strong>Message:</strong> ${data.message}<br>
                            <strong>User:</strong> ${data.data.user.firstName} ${data.data.user.lastName}<br>
                            <strong>Email:</strong> ${data.data.user.email}<br>
                            <strong>Role:</strong> ${data.data.user.role}<br>
                            <strong>Token:</strong> ${data.data.token.substring(0, 50)}...<br>
                            <strong>Response:</strong> ${JSON.stringify(data, null, 2)}
                        </div>
                    `;
                } else {
                    resultDiv.innerHTML = `
                        <div class="error">
                            <strong>❌ Login Failed!</strong><br><br>
                            <strong>Status:</strong> ${response.status}<br>
                            <strong>Message:</strong> ${data.message || 'Unknown error'}<br>
                            <strong>Response:</strong> ${JSON.stringify(data, null, 2)}
                        </div>
                    `;
                }
            } catch (error) {
                resultDiv.innerHTML = `
                    <div class="error">
                        <strong>🚨 Network Error!</strong><br><br>
                        <strong>Error:</strong> ${error.message}<br>
                        <strong>Details:</strong> Make sure backend is running on http://localhost:3000
                    </div>
                `;
            }
        });

        // Test API connection on page load
        window.addEventListener('load', async () => {
            console.log('🔵 Page loaded, testing backend connection...');
            try {
                const response = await fetch('/health');  // Use relative URL
                const data = await response.json();
                console.log('✅ Backend health check:', data);
            } catch (error) {
                console.log('❌ Backend not reachable:', error.message);
                alert('⚠️ Cannot connect to backend! Make sure server is running.');
            }
        });
    </script>
</body>
</html>
